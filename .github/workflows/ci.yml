name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # gh release 更新 latest(仅 main push 用到;PR 同样授但 release 步骤有 if 挡)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查(全部 workspace)
        run: npm run typecheck
      - name: core 冒烟测试
        run: npm test
      - name: Chrome 扩展打包
        run: npm run build
      - name: Tauri 前端打包
        run: npm run build:tauri
      - name: CDP fixture 自测(headless)
        run: npm run selftest --workspace @docs-compare/cdp -- --headless
        env:
          CI: '1'
      # live 自测依赖外网站点,不进 CI;需要时本地跑 npm run selftest:cdp:live

      # 扩展 zip:双通道分发,均为固定位置
      # 1) Release latest(首页可见、链接永不过期):每次 main push 滚动更新
      # 2) artifact(备源):同名覆盖,90 天保留
      - name: 打包扩展 zip
        run: |
          cd apps/chrome-extension/dist
          zip -r ../docs-compare-extension.zip .
      # 远程站点列表资产:以 DEFAULT_SITES 为事实源生成 sites.json
      # (anchorMapUrl 写 Release 绝对 URL),连同锚点表一起下发——
      # 扩展/Tauri 客户端从此免更新获取新收录站点
      - name: 生成远程 sites.json
        run: node scripts/gen-remote-sites.mjs out/remote-sites
      - name: 断言:sites.json 锚点表地址全为 Release 绝对 URL
        run: |
          node -e "
            const s = require('./out/remote-sites/sites.json');
            const base = 'https://github.com/lif3ng-vibe/docs-compare/releases/download/latest/anchor-maps-';
            const bad = s.filter(x => !x.anchorMapUrl.startsWith(base) || (x.pageMapUrl && !x.pageMapUrl.startsWith(base)));
            if (bad.length) { console.error('非 Release 地址:', bad.map(x=>x.id)); process.exit(1); }
            console.log('ok:', s.length, '站,锚点表地址全为 Release 绝对 URL');
          "
      - name: 准备远程资产(锚点表平铺命名 anchor-maps-<id>.json,gh 资产名不允许 '/')
        run: |
          mkdir -p out/remote-sites
          for f in apps/chrome-extension/src/static/anchor-maps/*.json; do
            cp "$f" "out/remote-sites/anchor-maps-$(basename "$f")"
          done
          ls out/remote-sites/
      - name: 上传扩展 zip(固定名 artifact)
        uses: actions/upload-artifact@v4
        with:
          name: docs-compare-extension
          path: apps/chrome-extension/docs-compare-extension.zip
          retention-days: 90
          overwrite: true
      - name: 发布到 Release latest(首页固定下载位)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          # 滚动 release:tag latest 每次移到最新 commit;无则创建,有则更新并换附件
          gh release view latest -R "$GITHUB_REPOSITORY" 2>/dev/null \
            && gh release delete latest -R "$GITHUB_REPOSITORY" --cleanup-tag --yes \
            || true
          gh release create latest \
            -R "$GITHUB_REPOSITORY" \
            -t "最新构建(扩展 + 桌面安装包)" \
            -n "main 分支每次 push 自动滚动扩展构建;桌面安装包由「Tauri 打包(手动)」工作流按需附上。当前: $SHA @ $DATE

          - docs-compare-extension.zip:Chrome 扩展,解压后 chrome://extensions 开发者模式加载解压目录
          - sites.json + anchor-maps-*.json:站点列表与锚点表(客户端远程热更数据源,固定 URL 永不变化)
          - docs-compare_*_x64-setup.exe:Windows 安装包(Tauri,手动触发构建)
          - docs-compare*_aarch64.dmg / *_x64.dmg:macOS 安装包(Tauri,手动触发构建,无签名首开右键打开)

          完整构建日志: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --target main \
            apps/chrome-extension/docs-compare-extension.zip \
            out/remote-sites/sites.json \
            out/remote-sites/anchor-maps-*.json
