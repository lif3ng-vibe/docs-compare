name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查(全部 workspace)
        run: npm run typecheck
      - name: core 冒烟测试
        run: npm test
      - name: Chrome 扩展打包
        run: npm run build
      - name: Tauri 前端打包
        run: npm run build:tauri
      - name: CDP fixture 自测(headless)
        run: npm run selftest --workspace @docs-compare/cdp -- --headless
        env:
          CI: '1'
      # live 自测依赖外网站点,不进 CI;需要时本地跑 npm run selftest:cdp:live

      # 扩展 zip:每次 main push 覆盖同名 artifact,链接恒定,随时可下载最新代码的产物
      - name: 打包扩展 zip
        run: |
          cd apps/chrome-extension/dist
          zip -r ../docs-compare-extension.zip .
      - name: 上传扩展 zip(固定名 artifact)
        uses: actions/upload-artifact@v4
        with:
          name: docs-compare-extension
          path: apps/chrome-extension/docs-compare-extension.zip
          retention-days: 90
          overwrite: true
