name: Tauri 打包(手动)

# 手动触发:Windows(NSIS .exe)+ macOS(.dmg)并行打包,附到 Release latest。
# 不进 push CI——Rust 冷编译 10+ 分钟,按需跑;公共仓库标准 runner 免费,双平台零成本。
# 本地等价流程见 .claude/skills/tauri/SKILL.md(Windows 实测 ~2.2 MB)。

on:
  workflow_dispatch: {}

permissions:
  contents: write # 往 Release latest 传附件

jobs:
  build:
    strategy:
      fail-fast: false # 一平台失败不影响另一平台产物
      matrix:
        include:
          - os: windows-latest
            platform: windows
            # bundle.targets 走 tauri.conf.json(nsis);macOS 需 dmg,命令行覆盖
          - os: macos-latest
            platform: macos
            extra-args: --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # 按 Cargo.lock 缓存 target/,后续构建 3-5 分钟(按平台分桶)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri

      - run: npm ci

      # tauri.conf.json 无 beforeBuildCommand,前端产物先手动备好(frontendDist 指向 ../frontend-dist)
      - name: Tauri 前端打包
        run: npm run build:tauri

      - name: 打安装包
        working-directory: apps/tauri/src-tauri
        run: npx --yes @tauri-apps/cli@^2 build ${{ matrix.extra-args || '' }}

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-compare-tauri-${{ matrix.platform }}
          # Windows: nsis/*-setup.exe;macOS: dmg/*.dmg——两形态一次 glob,
          # 各平台只有自己那份匹配,upload-artifact 对无匹配 glob 容忍
          path: |
            apps/tauri/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/tauri/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      # Release latest 由主 CI 滚动管理(删了重建);这里只追加附件。
      # 若手动跑时 latest 尚不存在(理论上不会),兜底创建。
      - name: 附到 Release latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          # find 而非 ls 多 glob:另一平台的 glob 无匹配时 ls 整条非零
          # (-e -o pipefail 下直接挂),find 单分支无匹配不影响其余
          f=$(find apps/tauri/src-tauri/target/release/bundle -name '*-setup.exe' -o -name '*.dmg' | head -1)
          [ -n "$f" ] || { echo "找不到安装包产物"; exit 1; }
          if ! gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create latest -R "$GITHUB_REPOSITORY" \
              -t "最新构建(扩展 + 桌面安装包)" \
              -n "main 分支每次 push 自动滚动扩展构建;桌面安装包由「Tauri 打包(手动)」工作流按需附上。" \
              --target main
          fi
          gh release upload latest "$f" -R "$GITHUB_REPOSITORY" --clobber
          echo "已上传: $f @ $SHA $DATE"
