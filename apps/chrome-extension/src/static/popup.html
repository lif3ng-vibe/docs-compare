<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; padding: 12px; font: 13px/1.6 system-ui, -apple-system, sans-serif; color: #222; }
  #status { margin-bottom: 10px; padding: 8px 10px; background: #f5f6f8; border-radius: 6px; min-height: 20px; white-space: pre-wrap; word-break: break-all; }
  #status.err { background: #fdecea; color: #b3261e; }
  button { display: block; width: 100%; padding: 7px 0; margin-bottom: 8px; border: 0; border-radius: 6px;
           background: #1a73e8; color: #fff; font-size: 13px; cursor: pointer; }
  button.secondary { background: #e8eaed; color: #333; }
  button:disabled { opacity: .5; cursor: default; }
  label { display: flex; align-items: center; gap: 6px; padding: 3px 0; color: #333; }
  fieldset { border: 0; margin: 6px 0 0; padding: 0; }
  legend { font-size: 12px; color: #666; padding: 0 0 2px; }
  .hint { margin-top: 10px; font-size: 11px; color: #777; }
  #sitePicker { margin-bottom: 10px; }
  #sitePicker select { display: block; width: 100%; box-sizing: border-box; padding: 6px 8px; margin-bottom: 8px;
                       border: 1px solid #dadce0; border-radius: 6px; font: inherit; background: #fff; color: #222; }
</style>
</head>
<body>
<div id="status">加载中…</div>
<div id="sitePicker">
  <select id="siteSelect" aria-label="站点对"></select>
  <button id="openSite" class="secondary">打开所选站点对照</button>
</div>
<button id="pair">配对并打开对照页</button>
<button id="unpair" class="secondary" hidden>解除配对</button>
<label><input type="checkbox" id="navSync"> 跳转同步(点链接/锚点)</label>
<label><input type="checkbox" id="scrollSync"> 滚动同步</label>
<label><input type="checkbox" id="semanticScroll"> 语义滚动(按标题对齐,关闭则按比例)</label>
<label><input type="checkbox" id="focusCss"> 专注模式 CSS(快捷键 Alt+Shift+D)</label>
<fieldset>
  <legend>分屏方式</legend>
  <label><input type="radio" name="layout" value="windows"> 两窗口平铺(自动)</label>
  <label><input type="radio" name="layout" value="tabs"> 同窗口标签页 + Chrome 分屏</label>
</fieldset>
<p class="hint" id="hint"></p>
<script src="popup.js"></script>
</body>
</html>
