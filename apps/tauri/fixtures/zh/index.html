<h2 id="安装-orca">安装</h2>
<p>安装一。这里特意排得比英文版高:中文段落更长,用于验证语义(按标题)同步而不是按比例同步。</p>
<p>安装二。山不在高,有仙则名;水不在深,有龙则灵。斯是陋室,惟吾德馨。</p>
<p>安装三。苔痕上阶绿,草色入帘青。谈笑有鸿儒,往来无白丁。</p>

<h2 id="启动-orca">启动</h2>
<p>启动一。可以调素琴,阅金经。无丝竹之乱耳,无案牍之劳形。</p>
<p>启动二。南阳诸葛庐,西蜀子云亭。孔子云:何陋之有?</p>

<h2 id="用法-orca">用法</h2>
<p>用法一。落霞与孤鹜齐飞,秋水共长天一色。渔舟唱晚,响穷彭蠡之滨。</p>
<p>用法二。雁阵惊寒,声断衡阳之浦。</p>
