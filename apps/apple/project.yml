name: DocsCompare
options:
  bundleIdPrefix: dev.docscompare
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Mac Catalyst:与 iOS 同一套布局跑 macOS(分发仍以 Tauri dmg 为主)
    SUPPORTS_MACCATALYST: "YES"
    # 模拟器构建免签名(CI/本地 selftest 免 team);真机调试在 Xcode 里自选
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"
targets:
  DocsCompare:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.docscompare.apple
    sources:
      - path: ios/App
      # esbuild 产物目录(gitignored;先 npm run build 再 xcodegen)。
      # folder reference 整目录拷进 bundle → Bundle.main …/web/
      - path: web
        type: folder
        buildPhase: resources
    info:
      path: ios/App/Info.plist
      properties:
        CFBundleDisplayName: Docs Compare
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: DocsCompare.SceneDelegate
        # iPhone:竖屏(单文档)+ 横屏(对照);iPad:全四向(两模式皆可)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
schemes:
  DocsCompare:
    build:
      targets:
        DocsCompare: all
    run:
      config: Debug
